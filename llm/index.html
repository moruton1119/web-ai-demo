 * independently reviewed first-paint requirement.

(function () {
  var mode = 'system';
  try {
    var rawMode = localStorage.getItem("naidan:theme_mode");
    switch (rawMode) {
    case "light":
      mode = rawMode;
      break;
    case "dark":
      mode = rawMode;
      break;
    case "system":
      mode = rawMode;
      break;
    case null:
      break;
    default:
      break;
    }
  } catch (_error) {
    mode = 'system';
  }

    && matchMedia('(prefers-color-scheme: dark)').matches;
  var resolvedTheme = 'light';
  switch (mode) {
  case 'light':
    resolvedTheme = 'light';
    break;
  case 'dark':
    resolvedTheme = 'dark';
    break;
  case 'system':
    resolvedTheme = systemIsDark ? 'dark' : 'light';
    break;
  }
  var root = document.documentElement;
  if (resolvedTheme === 'dark') {
    root.classList.add('dark');
  } else {
    root.classList.remove('dark');
  }
  root.style.colorScheme = resolvedTheme;
  root.setAttribute("data-naidan-resolved-theme", resolvedTheme);
  root.setAttribute("data-naidan-theme-control", 'document-bootstrap');
})();</script>
